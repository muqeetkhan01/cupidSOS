name: cupid_app
description: "Cupid SOS dating application UI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: 
  responsive_sizer: ^3.3.1
  image_picker: ^1.0.7
  remixicon:
  get:
    # Firebase packages
  firebase_core: 3.8.0
  firebase_auth: 5.3.3
  cloud_firestore: 5.5.0
  firebase_storage:
  intl:
  google_maps_flutter:
  place_picker_google: 

  # Image handling (split, crop, convert)
  image: ^4.1.7
  crypto: ^3.0.6
  http:
  google_sign_in: 7.2.0
  sign_in_with_apple:
  fancy_shimmer_image:
  videosdk: 3.7.0
  videosdk_webrtc:
  permission_handler:
  flutter_local_notifications: 
  record: 
  audioplayers:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 
  flutter_launcher_icons:

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "path/to/image.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
